{% extends 'base.html' %}
{% block title %}Portal temporariamente indisponível{% endblock %}
{% block content %}
<section class="portal-empty">
    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
    <div>
        <h1 class="h4">Portal temporariamente indisponível</h1>

</section>
{% endblock %}
