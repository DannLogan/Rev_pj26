{% extends 'base.html' %}
{% import 'componentes/macros.html' as ui %}

{% block title %}Scanner{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="mb-4">
            <div class="d-flex justify-content-end mb-2">
                <a href="{{ url_for('professor.professor_projeto', projeto_id=projeto_id) }}" class="btn btn-sm btn-secondary fw-bold shadow-sm">
                    <i class="bi bi-arrow-left-short"></i> Voltar
                </a>
            </div>
            <h2 class="text-primario-evento fw-bold mb-0">Leitor de Credenciais</h2>
        </div>

        {% call ui.card() %}
            <div class="p-3 border border-dashed rounded bg-light text-center">
                <div id="reader" class="mx-auto rounded border bg-white mb-3" style="width: 100%; max-width: 340px;"></div>
                <p id="status-scan" role="status" class="fw-bold mb-0 text-secondary">Aponte a câmera para a credencial do aluno.</p>
                <button id="retry-scan" type="button" class="btn btn-outline-secondary mt-3" hidden>Tentar novamente</button>
            </div>
        {% endcall %}
    </div>
</div>

<form id="registrar-presenca" method="post" action="{{ url_for('professor.registrar_presenca', projeto_id=projeto_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="edicao" value="{{ id_edicao }}">
    <input type="hidden" name="qr_token">
</form>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('registrar-presenca');
        const status = document.getElementById('status-scan');
        const retry = document.getElementById('retry-scan');
        let scanner;
        let submitting = false;

        async function startScanner() {
            retry.hidden = true;
            status.textContent = 'Iniciando câmera…';

            try {
                scanner ??= new Html5Qrcode('reader');
                await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (decodedText) => {
                    if (submitting) return;
                    if (!decodedText || decodedText.length > 255) {
                        status.textContent = 'Credencial inválida. Aponte para o QR code do aluno.';
                        return;
                    }
                    submitting = true;
                    status.textContent = 'Registrando presença…';
                    form.elements.qr_token.value = decodedText;
                    form.submit();
                });
                if (!submitting) status.textContent = 'Aponte a câmera para a credencial do aluno.';
            } catch {
                status.textContent = 'Não foi possível iniciar o leitor. Confira a câmera, as permissões e a conexão.';
                retry.hidden = false;
            }
        }

        retry.addEventListener('click', startScanner);
        startScanner();
    });
</script>
{% endblock %}
