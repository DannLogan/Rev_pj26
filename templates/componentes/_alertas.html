{% with mensagens = get_flashed_messages(with_categories=true) %}
    {% if mensagens %}
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
            {% for categoria, mensagem in mensagens %}
                <div class="alert alert-{% if categoria == 'erro' %}danger{% elif categoria == 'sucesso' %}success{% else %}info{% endif %} alert-dismissible fade show shadow animate-fade-in" role="alert">
                    <i class="bi {% if categoria == 'erro' %}bi-exclamation-triangle-fill{% elif categoria == 'sucesso' %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %} me-2"></i>
                    
                    {{ mensagem | safe }}
                    
                    <button type="button" class="btn-close shadow-none" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>

        <script>
            (function() {
                console.log("🚨 Mecanismo interno de alertas inicializado!");
                
                // 1. Força o fechamento imediato ao clicar no "X"
                document.querySelectorAll('.toast-container .btn-close').forEach(function(botaoX) {
                    botaoX.addEventListener('click', function() {
                        const caixaAlerta = botaoX.closest('.alert');
                        if (caixaAlerta) {
                            caixaAlerta.style.transition = 'opacity 0.3s ease';
                            caixaAlerta.style.opacity = '0';
                            setTimeout(function() { caixaAlerta.remove(); }, 300);
                        }
                    });
                });

                // 2. Sumir automaticamente após 4 segundos com efeito suave
                setTimeout(function() {
                    document.querySelectorAll('.toast-container .alert').forEach(function(caixaAlerta) {
                        caixaAlerta.style.transition = 'opacity 0.4s ease';
                        caixaAlerta.style.opacity = '0';
                        setTimeout(function() { caixaAlerta.remove(); }, 400);
                    });
                }, 4000);
            })();
        </script>
    {% endif %}
{% endwith %}
